<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1315" />
      <stop offset="100%" stop-color="#040708" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded octagon / star foundation -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Sacred Geometric 8-point Islamic Star / Rub el Hizb background lattice -->
  <g opacity="0.15" stroke="url(#primaryGlow)" stroke-width="3" fill="none">
    <rect x="156" y="156" width="200" height="200" rx="20" transform="rotate(0 256 256)"/>
    <rect x="156" y="156" width="200" height="200" rx="20" transform="rotate(45 256 256)"/>
  </g>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- 3D Monogram "D" merged with Crescent & Islamic Arch Motif -->
  <g filter="url(#glow)">
    <!-- Arch / Crescent Outer Curve -->
    <path d="M 210 120 C 310 120, 380 170, 380 256 C 380 342, 310 392, 210 392 L 170 392 C 158 392, 150 384, 150 372 L 150 140 C 150 128, 158 120, 170 120 Z" 
          fill="url(#primaryGlow)" />
          
    <!-- Inner Cutout creating the 'D' and glowing mihrab/crescent silhouette -->
    <path d="M 210 166 L 196 166 L 196 346 L 210 346 C 275 346, 324 310, 324 256 C 324 202, 275 166, 210 166 Z" 
          fill="url(#bgGrad)" />

    <!-- Mihrab Dome inner accent in Gold -->
    <path d="M 216 200 C 248 200, 272 224, 272 256 C 272 288, 248 312, 216 312 L 206 312 L 206 200 Z" 
          fill="url(#goldGlow)" opacity="0.9" />

    <!-- 8-Pointed Star Center Accent -->
    <g transform="translate(256, 256) scale(0.65)" fill="url(#goldGlow)">
      <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" />
      <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" transform="rotate(45)" />
    </g>
  </g>
</svg>
